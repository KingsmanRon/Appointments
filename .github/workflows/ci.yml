name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          {
            POSTGRES_DB: access_test,
            POSTGRES_USER: postgres,
            POSTGRES_PASSWORD: postgres,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      {
        TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/access_test",
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate:infra
      - run: npm run check:secrets
